services:
  - type: web
    name: salama-connect
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health.html
    envVars:
      - key: APP_NAME
        value: Salama Connect
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: PGSSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: salama-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: salama-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: salama-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: salama-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: salama-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: salama-db
          property: password

databases:
  - name: salama-db
    plan: free
    databaseName: salama
    user: salama
    region: frankfurt
